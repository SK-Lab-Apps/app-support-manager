# Supabase CLI project config (used by `supabase db push` / `functions deploy`).
project_id = "support-platform"

# End-user-facing functions authenticate with x-api-key (per app), not a
# Supabase JWT — JWT verification must stay off for all of them.
[functions.submit-query]
verify_jwt = false

[functions.get-threads]
verify_jwt = false

[functions.post-message]
verify_jwt = false

[functions.mark-read]
verify_jwt = false

[functions.get-unread-count]
verify_jwt = false

[functions.register-push]
verify_jwt = false

[functions.set-language]
verify_jwt = false

# SDK 0.4+: the support chat's send, and the per-launch user registration.
[functions.send-message]
verify_jwt = false

[functions.register-user]
verify_jwt = false

# SDK 0.4+: records a tap on a review request's store button.
[functions.review-opened]
verify_jwt = false

# Staff-facing: called by the dashboard with an admin JWT.
[functions.send-push]
verify_jwt = true

[functions.send-outreach]
verify_jwt = true

# Two callers, two credentials — the dashboard with an admin JWT and the
# pg_cron sweep with the shared cron token — so the function checks both
# itself rather than delegating to the platform.
[functions.translate-message]
verify_jwt = false

# Machine-to-machine: invoked by the pg_cron job with a shared bearer token
# (ESCALATION_CRON_TOKEN), which the function checks itself.
[functions.escalate-unread]
verify_jwt = false

# Machine-to-machine: RevenueCat's webhook, with a shared bearer token
# (REVENUECAT_WEBHOOK_SECRET), which the function checks itself.
[functions.revenuecat-webhook]
verify_jwt = false
